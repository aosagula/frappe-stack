[project]
name = "agentic_base"
authors = [
    { name = "Agentic4Biz", email = "alejandro.sagula@gmail.com"}
]
description = "Capa base comun a todos los clientes: correcciones sobre el core sin modificarlo, localizacion y utilidades compartidas."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "W191"]

[tool.ruff.format]
indent-style = "tab"
